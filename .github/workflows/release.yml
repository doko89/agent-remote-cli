name: release

on:
  push:
    tags:
      - "v*"

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: gofmt -l .
        # gofmt prints files needing format; empty output = clean.
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: agent-remote-linux-amd64.tar.gz
            binary: agent-remote
          - goos: linux
            goarch: arm64
            artifact: agent-remote-linux-arm64.tar.gz
            binary: agent-remote
          - goos: windows
            goarch: amd64
            artifact: agent-remote-windows-amd64.tar.gz
            binary: agent-remote.exe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-w -s -X main.version=${GITHUB_REF_NAME}" \
            -o dist/${{ matrix.binary }} .
          tar -czf dist/${{ matrix.artifact }} -C dist ${{ matrix.binary }}
          rm dist/${{ matrix.binary }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
